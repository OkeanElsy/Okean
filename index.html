<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKEAN | ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=JetBrains+Mono:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader" class="simple-loader">
        <div class="loader-content">
            <h2 class="gothic-text">Okean</h2>
            <div class="load-line"></div>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-links">
            <a href="#home" data-i18n="nav.home">HOME</a>
            <a href="#skills" data-i18n="nav.skills">KNOWLEDGE</a>
            <a href="#contact" data-i18n="nav.contact">MESSAGE</a>
        </div>
        <button id="langToggle" class="lang-btn">EN / JA</button>
    </nav>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <h1 class="gothic-title" data-i18n="hero.title">Okean is Back</h1>
                <p class="mono-subtitle" data-i18n="hero.subtitle">Silence is the loudest sound.</p>
                <div class="hero-links">
                    <a href="#skills" class="link-btn">EXPLORE</a>
                </div>
            </div>
        </section>

        <section id="skills" class="skills-section">
            <h2 class="gothic-header" data-i18n="skills.title">Technical Arts</h2>
            <div class="skills-list">
                <div class="skill-item">
                    <span class="skill-name">Python Engine</span>
                    <span class="skill-desc">Bot construction & logic.</span>
                </div>
                <div class="skill-item">
                    <span class="skill-name">Cyber Security</span>
                    <span class="skill-desc">Defensive structures & testing.</span>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="gothic-text">MMXXVI</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
